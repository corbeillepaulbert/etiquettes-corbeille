<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Corbeille">
<title>Corbeille</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/composants.css">
<style>
  html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #app{height:100dvh;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #app>.scr{height:calc(100dvh - env(safe-area-inset-top))}
  button,label.btn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
  @media (min-width:768px){#app>.scr .scr__corps,#app>.scr .scr__bas{max-width:600px;width:100%;margin:0 auto;box-sizing:border-box}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="cb"></div>
<noscript>Corbeille a besoin de JavaScript.</noscript>
